<!DOCTYPE html>
<!--
  C4 Interactive Architecture Diagram — template skeleton.

  To generate the final artifact (a single self-contained .html):
    1. Replace the MODEL constant below with the documented system.
    2. Inline diagram.css into the <style> tag (replacing the <link>).
    3. Inline diagram.js into the final <script> tag (replacing src=).

  Design + interaction spec: references/html-diagram-design.md
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C4 Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="diagram.css">
</head>
<body>

<div id="canvas">
  <div id="world">
    <div id="grid"></div>
    <svg id="edges">
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0.6 L7.6,4 L0,7.4 Z" fill="#838A8D"/>
        </marker>
        <marker id="arrow-hl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0.6 L7.6,4 L0,7.4 Z" fill="#73E5F6"/>
        </marker>
      </defs>
      <g id="edge-g"></g>
    </svg>
    <div id="groups-layer"></div>
    <div id="labels-layer"></div>
    <div id="nodes-layer"></div>
  </div>

  <div class="bar" id="topbar">
    <button id="nav-back" title="Back">&#8592;</button>
    <button id="nav-fwd" title="Forward">&#8594;</button>
    <div class="sep"></div>
    <div id="crumbs"></div>
  </div>

  <div class="bar" id="legend"></div>

  <div class="bar" id="zoombar">
    <button id="z-out">&minus;</button>
    <span id="zoomlvl">100%</span>
    <button id="z-in">+</button>
    <button id="z-fit" title="Fit to view">&#x26F6;</button>
  </div>

  <div id="panel"></div>
</div>

<script>
/* ============================================================================
   MODEL — replace with the documented system.
   kinds: system | app | store | component | actor    scope: internal | external
   childDiagram links a node/group to another diagram key (drill-down).
============================================================================ */
const MODEL = {
  title: "Sample Platform",
  diagrams: {
    "context": {
      name: "Context Diagram", type: "context", parent: null,
      nodes: [
        { id:"customer", kind:"actor",  name:"Customer", x:60,  y:140 },
        { id:"platform", kind:"system", name:"Commerce Platform", tech:"Rails", icon:"🛒",
          scope:"internal", x:340, y:130, childDiagram:"platform",
          description:"Core e-commerce system handling catalog, checkout and orders." },
        { id:"stripe",   kind:"system", name:"Stripe", tech:"Stripe", icon:"💳",
          scope:"external", x:700, y:40,
          description:"Third-party payment processing." },
        { id:"mailer",   kind:"system", name:"SendGrid", tech:"SendGrid", icon:"✉️",
          scope:"external", x:700, y:230 }
      ],
      groups: [],
      edges: [
        { from:"customer", to:"platform", label:"Browses & buys" },
        { from:"platform", to:"stripe",   label:"Charges cards" },
        { from:"platform", to:"mailer",   label:"Sends receipts" }
      ]
    },
    "platform": {
      name: "Commerce Platform", type: "container", parent: "context",
      nodes: [
        { id:"customer2", kind:"actor", name:"Customer", x:40, y:180 },
        { id:"web",  kind:"app",   name:"Storefront", tech:"Next.js", icon:"🌐",
          group:"g-platform", x:340, y:120, description:"Server-rendered storefront UI." },
        { id:"api",  kind:"app",   name:"API", tech:"Rails", icon:"⚙️",
          group:"g-platform", x:600, y:120 },
        { id:"db",   kind:"store", name:"Orders DB", tech:"Postgres", icon:"🗄️",
          group:"g-platform", x:860, y:120 },
        { id:"stripe2", kind:"system", name:"Stripe", tech:"Stripe", icon:"💳",
          scope:"external", x:620, y:430 }
      ],
      groups: [
        { id:"g-platform", name:"Commerce Platform", tech:"Rails", icon:"🛒",
          x:290, y:50, w:830, h:250 }
      ],
      edges: [
        { from:"customer2", to:"web",     label:"Uses" },
        { from:"web",       to:"api",     label:"JSON/HTTPS" },
        { from:"api",       to:"db",      label:"Reads & writes" },
        { from:"api",       to:"stripe2", label:"Charges cards" }
      ]
    }
  }
};
</script>
<script src="diagram.js"></script>
</body>
</html>
